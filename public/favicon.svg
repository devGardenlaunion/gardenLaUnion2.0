<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon = isotipo GC de la marca, simplificado (GC centrada) para leerse
       a 16px, que es como Google lo muestra junto al nombre en los resultados.
       El staggered del isotipo grande se pierde a ese tamaño; acá va centrado. -->
